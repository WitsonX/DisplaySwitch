<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>草图 · 每行选角色 竖版（主/镜像/扩展）</title>
<style>
html{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;background:light-dark(#e8e8ed,#111114)}
</style>
</head>
<body>
<div id="ds-role-sketch">
<style>
#ds-role-sketch{
  color-scheme:light dark;
  --bg:light-dark(#f5f5f7,#1c1c1e);
  --card:light-dark(#ffffff,#2a2a2c);
  --t1:light-dark(#1d1d1f,#f2f2f4);
  --t2:light-dark(#86868b,#98989e);
  --div:light-dark(rgba(0,0,0,.06),rgba(255,255,255,.08));
  --acc:light-dark(#0a84ff,#5aa8ff);
  --accs:light-dark(rgba(10,132,255,.12),rgba(90,168,255,.18));
  --fill:light-dark(rgba(0,0,0,.05),rgba(255,255,255,.08));
  font-family:var(--font-sans,-apple-system,"PingFang SC","Helvetica Neue",sans-serif);
  font-size:13px;
  color:var(--t1);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
#ds-role-sketch .sk-panel{width:336px;max-width:100%;background:var(--bg);border-radius:16px;box-shadow:light-dark(0 12px 40px rgba(0,0,0,.16),0 12px 40px rgba(0,0,0,.5));overflow:hidden;}
#ds-role-sketch .sk-header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;}
#ds-role-sketch .sk-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
#ds-role-sketch .sk-title svg{width:15px;height:15px;}
#ds-role-sketch .sk-pill{margin-left:auto;font-size:11px;color:var(--t2);background:var(--fill);padding:3px 9px;border-radius:999px;white-space:nowrap;}
#ds-role-sketch .sk-body{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px;}
#ds-role-sketch .sk-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);padding:0 4px;}
#ds-role-sketch .sk-dot{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--acc);color:#fff;font-size:10px;font-weight:500;flex:none;}
#ds-role-sketch .sk-card{background:var(--card);border-radius:12px;}
#ds-role-sketch .sk-row{display:flex;gap:10px;padding:10px 12px;}
#ds-role-sketch .sk-bt{border-top:1px solid var(--div);}
#ds-role-sketch .sk-row-icon{width:30px;height:30px;border-radius:8px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none;color:var(--t1);}
#ds-role-sketch .sk-row-icon svg{width:17px;height:17px;}
#ds-role-sketch .sk-row-main{flex:1;min-width:0;}
#ds-role-sketch .sk-line1{display:flex;align-items:center;gap:8px;}
#ds-role-sketch .sk-row-title{font-size:13px;font-weight:500;flex:1;min-width:0;}
#ds-role-sketch .sk-role{font-size:11px;padding:3px 6px;border-radius:7px;border:1px solid var(--div);background:var(--fill);color:var(--t1);font-family:inherit;cursor:pointer;max-width:130px;}
#ds-role-sketch .sk-role-main{border-color:var(--acc);background:var(--accs);color:var(--acc);font-weight:500;}
#ds-role-sketch .sk-line2{display:flex;align-items:center;gap:8px;margin-top:8px;}
#ds-role-sketch .sk-gfx{width:38px;height:25px;border-radius:5px;border:1.5px solid var(--acc);background:var(--accs);color:var(--acc);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
#ds-role-sketch .sk-gfx-mirror{border-style:dashed;}
#ds-role-sketch .sk-res-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--div);background:var(--bg);color:var(--t1);cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums;}
#ds-role-sketch .sk-res-chip svg{width:9px;height:9px;color:var(--t2);}
#ds-role-sketch .sk-follow{font-size:11px;color:var(--t2);}
#ds-role-sketch .sk-reslist{margin-top:8px;border:1px solid var(--div);border-radius:9px;overflow:hidden;max-height:150px;overflow-y:auto;}
#ds-role-sketch .sk-res-row{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:transparent;font-size:12px;color:var(--t1);cursor:pointer;font-family:inherit;text-align:left;}
#ds-role-sketch .sk-res-row + .sk-res-row{border-top:1px solid var(--div);}
#ds-role-sketch .sk-res-val{font-variant-numeric:tabular-nums;}
#ds-role-sketch .sk-res-tag{font-size:10px;color:var(--t2);background:var(--fill);padding:1px 6px;border-radius:999px;}
#ds-role-sketch .sk-res-check{width:13px;height:13px;margin-left:auto;color:var(--acc);opacity:0;flex:none;}
#ds-role-sketch .sk-res-cur .sk-res-check{opacity:1;}
#ds-role-sketch .sk-res-cur .sk-res-val{color:var(--acc);font-weight:500;}
#ds-role-sketch .sk-legend{width:336px;max-width:100%;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--t2);line-height:1.5;}
#ds-role-sketch .sk-legend p{margin:0;display:flex;gap:7px;align-items:flex-start;}
#ds-role-sketch .sk-legend .sk-dot{margin-top:2px;}
#ds-role-sketch .sk-legend-tip{color:var(--acc);}
</style>

<div class="sk-panel">
  <header class="sk-header">
    <div class="sk-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="11.5" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>显示器</div>
    <div class="sk-pill" id="sk-pill" aria-live="polite"></div>
  </header>
  <div class="sk-body">
    <div class="sk-label">显示器<span class="sk-dot">1</span></div>
    <div class="sk-card" id="sk-rows"></div>
  </div>
</div>

<div class="sk-legend">
  <p><span class="sk-dot">1</span>每行一个角色下拉：主显示器 / 与某屏镜像 / 扩展。主显示器全局唯一，在别的行选「主」会自动挪过去；虚线图形表示内容与目标屏相同。</p>
  <p><span class="sk-dot">2</span>「与X镜像」只出现在主屏或扩展屏上，不会套娃；主显示器被降级（选镜像或扩展）时，「主」自动交给另一台屏——主显示器永远存在。</p>
  <p><span class="sk-dot">3</span>只有主显示器和扩展屏需要设分辨率（点胶囊展开列表）；镜像屏跟随目标屏，目标改分辨率它跟着变。</p>
  <p class="sk-legend-tip">草图可交互：切换每行的角色下拉、点分辨率胶囊试试。</p>
</div>

<script>
(function(){
  var LAPTOP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="10" rx="1.5"/><path d="M2.5 18.5h19"/></svg>';
  var MONITOR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="11.5" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>';
  var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var CHECK='<svg class="sk-res-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  var D=[
    {id:'b', name:'内建显示器',   short:'内建',  builtin:true,  hz:120, modes:['1800×1169','1512×982','1352×878','1147×745','1024×665']},
    {id:'e1',name:'外接显示器 1', short:'外接1', builtin:false, hz:60,  modes:['3840×2160','3360×1890','3008×1692','2560×1440','2304×1296','1920×1080','1504×846']},
    {id:'e2',name:'外接显示器 2', short:'外接2', builtin:false, hz:60,  modes:['3840×2160','2560×1440','1920×1080','1280×720']}
  ];
  var roles={b:'main', e1:'mirror', e2:'extend'};
  var mirTarget={e1:'e2'};
  var res={b:'1512×982', e1:'3008×1692', e2:'3840×2160'};
  var expanded=null;

  function byId(id){ for(var i=0;i<D.length;i++) if(D[i].id===id) return D[i]; return null; }
  function letters(){
    var map={}, next=65;
    D.forEach(function(d){ if(roles[d.id]!=='mirror') map[d.id]=String.fromCharCode(next++); });
    D.forEach(function(d){ if(roles[d.id]==='mirror') map[d.id]=map[mirTarget[d.id]]||'?'; });
    return map;
  }

  function promoteMain(exceptId){
    for(var i=0;i<D.length;i++){
      var o=D[i];
      if(o.id===exceptId) continue;
      if(roles[o.id]!=='mirror'){ roles[o.id]='main'; return true; }
    }
    return false;
  }
  function setRole(id,val){
    if(val==='main'){
      D.forEach(function(o){ if(o.id!==id && roles[o.id]==='main') roles[o.id]='extend'; });
      roles[id]='main';
      delete mirTarget[id];
    } else if(val==='extend'){
      if(roles[id]==='main' && !promoteMain(id)) { render(); return; }
      roles[id]='extend';
      delete mirTarget[id];
    } else {
      var t=val.slice(7);
      if(roles[id]==='main') roles[t]='main';
      D.forEach(function(o){ if(o.id!==id && mirTarget[o.id]===id) mirTarget[o.id]=t; });
      roles[id]='mirror';
      mirTarget[id]=t;
    }
    expanded=null;
    render();
  }

  function render(){
    var lt=letters();
    var mainD=null, mirrorCount=0;
    D.forEach(function(d){ if(roles[d.id]==='main') mainD=d; if(roles[d.id]==='mirror') mirrorCount++; });

    var pill=document.getElementById('sk-pill');
    pill.textContent=D.length+'屏 · 主 '+mainD.short+(mirrorCount?' · '+mirrorCount+'屏镜像':'');

    var rows=document.getElementById('sk-rows');
    rows.innerHTML='';
    D.forEach(function(d,i){
      var role=roles[d.id];
      var row=document.createElement('div');
      row.className='sk-row'+(i?' sk-bt':'');

      var line2;
      if(role==='mirror'){
        var t=byId(mirTarget[d.id]);
        line2='<div class="sk-line2">'+
          '<span class="sk-gfx sk-gfx-mirror" title="内容与'+t.short+'相同">'+lt[d.id]+'</span>'+
          '<span class="sk-follow">跟随'+t.short+' · '+res[t.id]+'</span>'+
        '</div>';
      } else {
        line2='<div class="sk-line2">'+
          '<span class="sk-gfx" title="这块屏显示的内容">'+lt[d.id]+'</span>'+
          '<button type="button" class="sk-res-chip" data-res="'+d.id+'">'+res[d.id]+' · '+d.hz+'Hz'+CHEV+'</button>'+
        '</div>'+
        (expanded===d.id?'<div class="sk-reslist" data-list="'+d.id+'"></div>':'');
      }

      row.innerHTML='<div class="sk-row-icon">'+(d.builtin?LAPTOP:MONITOR)+'</div>'+
        '<div class="sk-row-main">'+
          '<div class="sk-line1"><span class="sk-row-title">'+d.name+'</span><select class="sk-role'+(role==='main'?' sk-role-main':'')+'" data-role="'+d.id+'"></select></div>'+
          line2+
        '</div>';

      var sel=row.querySelector('select');
      function opt(label,value,selected){
        var o=document.createElement('option');
        o.value=value; o.textContent=label;
        if(selected) o.selected=true;
        sel.appendChild(o);
      }
      opt('主显示器','main',role==='main');
      D.forEach(function(o){
        if(o.id===d.id) return;
        if(roles[o.id]==='mirror') return;
        if(mirTarget[o.id]===d.id) return;
        opt('与 '+o.short+' 镜像','mirror:'+o.id, role==='mirror'&&mirTarget[d.id]===o.id);
      });
      opt('扩展显示器','extend',role==='extend');
      sel.addEventListener('change',function(){ setRole(d.id, sel.value); });

      var chip=row.querySelector('.sk-res-chip');
      if(chip) chip.addEventListener('click',function(){
        expanded=(expanded===d.id)?null:d.id;
        render();
      });

      var list=row.querySelector('.sk-reslist');
      if(list){
        d.modes.forEach(function(m,mi){
          var rw=document.createElement('button');
          rw.type='button';
          rw.className='sk-res-row'+(res[d.id]===m?' sk-res-cur':'');
          rw.innerHTML='<span class="sk-res-val">'+m+'</span>'+(mi===0?'<span class="sk-res-tag">原生</span>':'')+CHECK;
          rw.addEventListener('click',function(){ res[d.id]=m; expanded=null; render(); });
          list.appendChild(rw);
        });
      }

      rows.appendChild(row);
    });
  }

  render();
})();
</script>
</div>
</body>
</html>
